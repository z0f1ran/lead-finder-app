name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # можно запустить вручную кнопкой в GitHub

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: python -m PyInstaller --onefile --windowed --name PoiskKlientov --clean lead_finder_gui.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: PoiskKlientov-windows
          path: dist/PoiskKlientov.exe
